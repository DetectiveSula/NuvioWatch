name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Find Nuvio's public server key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          assets=$(gh release view --repo tapframe/NuvioStreaming --json assets --jq '.assets[].name' | grep -iE '\.apk$')
          asset=$(echo "$assets" | grep -iE 'universal' | head -1)
          [ -z "$asset" ] && asset=$(echo "$assets" | grep -iE 'arm64' | head -1)
          [ -z "$asset" ] && asset=$(echo "$assets" | head -1)
          if [ -n "$asset" ]; then
            gh release download --repo tapframe/NuvioStreaming --pattern "$asset" --dir "$RUNNER_TEMP/nuvio"
            python3 scripts/find_nuvio_key.py "$RUNNER_TEMP/nuvio/$asset" >> "$GITHUB_ENV"
          fi
          if ! grep -q NUVIO_SERVER_KEY "$GITHUB_ENV"; then
            echo "::warning::Couldn't find Nuvio's key automatically. The app will read it from the Nuvio app on your phone, or ask for it."
          fi

      - name: Set up signing key (optional)
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :core:test :app:assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          grep -E '^e: |error:|What went wrong|Caused by|[Kk]eystore|password|alias|Tag number' -A2 build.log | grep -v '^\s*at ' | head -60 | while IFS= read -r line; do echo "::error::$line"; done

      - name: Rename APK
        run: cp app/build/outputs/apk/release/*.apk NuvioWatch.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NuvioWatch-apk
          path: NuvioWatch.apk

      # Only builds signed with the permanent key are published, so they always install over each other.
      - name: Publish release
        if: env.SIGNING_KEYSTORE_BASE64 != '' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="1.0.${GITHUB_RUN_NUMBER}"
          gh release create "v$version" NuvioWatch.apk \
            --title "Nuvio Watch $version" \
            --notes "$(git log -1 --pretty=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' | sed '/^$/N;/^\n$/D')" \
            --latest

  mac-helper:
    needs: build
    runs-on: macos-latest
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the Mac helper (Intel + Apple silicon)
        run: |
          mkdir -p build/NuvioWatch-Mac
          swiftc -O -target arm64-apple-macos12 mac-helper/NuvioWatchHelper.swift -o build/helper-arm64
          swiftc -O -target x86_64-apple-macos12 mac-helper/NuvioWatchHelper.swift -o build/helper-x86_64
          lipo -create build/helper-arm64 build/helper-x86_64 -output build/NuvioWatch-Mac/nuvio-watch-helper
          codesign --force --sign - build/NuvioWatch-Mac/nuvio-watch-helper
          cp mac-helper/install.sh mac-helper/uninstall.sh build/NuvioWatch-Mac/
          cd build && zip -r NuvioWatch-Mac.zip NuvioWatch-Mac

      - uses: actions/upload-artifact@v4
        with:
          name: NuvioWatch-Mac
          path: build/NuvioWatch-Mac.zip

      - name: Attach to the release
        if: env.SIGNING_KEYSTORE_BASE64 != '' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v1.0.${GITHUB_RUN_NUMBER}" build/NuvioWatch-Mac.zip --clobber
